{% extends "base.html" %}
{% block title %}Not Found — Account & Security{% endblock %}
{% block content %}
<div class="text-center py-8">
  <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-rose-100 mb-4">
    <i data-lucide="alert-circle" class="w-10 h-10 text-rose-600"></i>
  </div>
  <h2 class="text-xl font-bold text-rose-900 mb-2">404 — Page not found</h2>
  <p class="text-sm text-rose-700 mb-6">The page you are looking for does not exist.</p>
  <a href="{{ url_for('main.index') }}"
    class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-emerald-950 px-6 py-2.5 rounded-xl font-bold text-sm transition-all shadow-md">
    Go home
  </a>
</div>
{% endblock %}
